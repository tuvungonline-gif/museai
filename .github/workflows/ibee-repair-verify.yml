name: Build and verify IBEE video update
on:
  push:
    branches: [codex/ibee-video-repair-test]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the pinned Canvas source with the IBEE changes
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/ibee-upstream"
          git init -q "$upstream"
          git -C "$upstream" fetch --depth 1 https://github.com/huwanbin/Muse-Canvas.git 46d217189d13aeee690b6211f8a87674d70e4536
          git -C "$upstream" checkout -q --detach FETCH_HEAD
          web="$upstream/source/infinite-canvas/web"
          cp -a source/infinite-canvas/web/. "$web/"
          (
            cd "$web"
            npx --yes pnpm@10.20.0 install --frozen-lockfile
            npx --yes pnpm@10.20.0 run build
          )
          python - "$web/dist" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re
          import sys
          root = Path(sys.argv[1])
          with ZipFile("account-ui.zip", "w", ZIP_DEFLATED) as bundle:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      bundle.write(path, path.relative_to(root))
          with ZipFile("account-ui.zip") as bundle:
              asset = re.search(rb'/assets/index-[\w-]+\.js', bundle.read("index.html")).group()[1:].decode()
              script = bundle.read(asset).decode()
              assert "Kiểm tra lại tác vụ cũ" in script
              assert "Mất kết nối tạm thời" in script
          PY
          python install_account_assets.py --archive account-ui.zip --root . --check
      - name: Verify existing video recovery in Chromium
        run: |
          python -m pip install playwright imageio-ffmpeg
          python -m playwright install chromium
          python -u .github/test-ibee-video-browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: ibee-account-ui
          path: account-ui.zip
          if-no-files-found: error
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ibee-account-ui
      - name: Parse updater with Windows PowerShell
        shell: powershell
        run: |
          foreach ($name in @('install-members-windows.ps1','run-canvas-windows.ps1','setup-windows.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $name), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Verify Windows install and website routes
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/test-ibee-windows-package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  package:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          name: ibee-account-ui
      - name: Commit the verified bundle on the test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- account-ui.zip
          git commit -m 'Package the verified IBEE video repair'
          git push origin "HEAD:$GITHUB_REF"
          git rev-parse HEAD
          git hash-object account-ui.zip
